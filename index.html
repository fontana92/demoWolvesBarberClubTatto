<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Mantenemos meta tags y fuentes del original -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barbería Premium | Plataforma Multi-Sucursal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- HEREDAMOS TUS VARIABLES Y ESTILOS PREMIUM --- */
        :root {
            --primary: #0a0a0a;
            --accent: #c9a86a;
            --light: #f8f8f8;
            --white: #ffffff;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--white); color: var(--primary); }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* --- NUEVA SECCIÓN: SELECTOR DE SUCURSAL --- */
        .branch-section { padding: 60px 0; text-align: center; }
        .branch-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-top: 40px; 
        }

        .branch-card {
            background: var(--white);
            border: 1px solid #eee;
            border-radius: var(--radius-md);
            padding: 30px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .branch-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .branch-card.selected { border: 2px solid var(--accent); background: #fffcf5; }

        .branch-card i { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }
        .branch-card h3 { font-size: 1.4rem; margin-bottom: 10px; }
        .branch-card p { font-size: 0.9rem; color: #666; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 15px;
            background: #e1f5fe;
            color: #0288d1;
        }

        /* --- ESTILOS DE COMPONENTES HEREDADOS (Simplificados para esta demo) --- */
        header { background: var(--primary); color: white; padding: 15px 0; text-align: center; }
        .logo-img { height: 60px; border: 2px solid var(--accent); border-radius: 8px; }
        
        .section-title { font-size: 2rem; margin: 40px 0; text-align: center; position: relative; }
        .section-title::after { content: ''; display: block; width: 60px; height: 3px; background: var(--accent); margin: 10px auto; }

        .hidden { display: none; }

        /* Estilos de Botones */
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 18px 40px;
            border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%;
            transition: var(--transition);
        }
        .btn-primary:hover { background: var(--accent); color: var(--primary); transform: scale(1.02); }

        /* Grid de servicios y horarios (Mantenemos tu lógica visual) */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .item-card { border: 1px solid #eee; padding: 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .item-card:hover, .item-card.selected { border-color: var(--accent); background: #fffcf5; }
        
        #notification {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #2ecc71; color: white; padding: 15px 30px; border-radius: 50px;
            display: none; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <img src="https://i.postimg.cc/s2dsJwRZ/IMG-20260122-WA0001.jpg" alt="Logo" class="logo-img">
            <h1 style="color: var(--accent); margin-top: 10px;">PLATAFORMA CENTRAL DE RESERVAS</h1>
        </div>
    </header>

    <main class="container">
        <!-- PASO 1: SELECCIÓN DE SUCURSAL -->
        <section id="step-1" class="branch-section">
            <h2 class="section-title">¿En qué sucursal querés tu turno?</h2>
            <div class="branch-grid" id="branch-container">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>

        <!-- PASO 2: SERVICIOS Y BARBEROS (Solo se muestra tras elegir sucursal) -->
        <section id="step-2" class="hidden">
            <h2 class="section-title">Servicios en <span id="active-branch-name" style="color: var(--accent);"></span></h2>
            <div class="grid-3" id="services-container"></div>

            <h2 class="section-title">Elegí tu Barbero</h2>
            <div class="grid-3" id="barbers-container"></div>
        </section>

        <!-- PASO 3: FECHA Y HORA -->
        <section id="step-3" class="hidden">
            <h2 class="section-title">Seleccioná Día y Horario</h2>
            <div style="background: var(--light); padding: 30px; border-radius: 20px; text-align: center;">
                <input type="date" id="booking-date" class="form-input" style="padding: 10px; margin-bottom: 20px;">
                <div class="grid-3" id="hours-container" style="grid-template-columns: repeat(4, 1fr);">
                    <!-- Horarios dinámicos -->
                </div>
            </div>
            
            <div style="margin-top: 40px; background: #000; color: #fff; padding: 30px; border-radius: 20px;">
                <h3>Resumen de Reserva</h3>
                <p id="summary-text" style="margin: 15px 0; color: var(--accent-light);">Seleccioná todos los campos para continuar...</p>
                <button class="btn-primary" id="btn-confirm" onclick="confirmarReserva()" disabled>CONFIRMAR TURNO</button>
            </div>
        </section>
    </main>

    <div id="notification">Reserva enviada con éxito 🚀</div>

    <script>
    // 1. CONFIGURACIÓN DE LA "SHEET MADRE" Y CONTACTOS
    // Importante: Poné los números reales con el formato 549...
    const DATA = {
        sucursales: [
            { id: 'S1', nombre: 'Sucursal Centro', direccion: 'Av. Corrientes 1234', icon: 'fa-city' },
            { id: 'S2', nombre: 'Sucursal Norte', direccion: 'Calle Florida 500', icon: 'fa-shop' },
            { id: 'S3', nombre: 'Sucursal Boutique', direccion: 'Palermo Soho 789', icon: 'fa-crown' }
        ],
        barberos: [
            { id: 'B1', nombre: 'Feli', sucursal: 'S1', telefono: '5491100000000' }, 
            { id: 'B2', nombre: 'Nico', sucursal: 'S1', telefono: '5491100000000' },
            { id: 'B3', nombre: 'Esteban', sucursal: 'S2', telefono: '5491168705261' }, // Tu número
            { id: 'B4', nombre: 'Cristian', sucursal: 'S3', telefono: '5491100000000' }
        ],
        servicios: [
            { id: 'P1', nombre: 'Corte Premium', precio: 10000, sucursal: ['S1', 'S2', 'S3'] },
            { id: 'P2', nombre: 'Barba Real', precio: 5000, sucursal: ['S1', 'S3'] },
            { id: 'P3', nombre: 'Combo Full', precio: 14000, sucursal: ['S1', 'S2', 'S3'] }
        ]
    };

    // PEGÁ AQUÍ LA URL QUE TE DIO GOOGLE APPS SCRIPT (El Paso 1)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOuWcCbnJwYzwpUcdOq6YHuu7kEnkcyokPV9gcxpCvQSyNF-_TxOinHIHgHl57rpDw0g/exec";

    let reserva = {
        sucursal: null,
        servicio: null,
        barbero: null,
        fecha: null,
        hora: null
    };

    // --- FUNCIONES DE RENDERIZADO ---

    function renderBranches() {
        const container = document.getElementById('branch-container');
        container.innerHTML = DATA.sucursales.map(s => `
            <div class="branch-card" onclick="selectBranch('${s.id}', '${s.nombre}')" id="branch-${s.id}">
                <i class="fas ${s.icon}"></i>
                <h3>${s.nombre}</h3>
                <p>${s.direccion}</p>
                <span class="status-badge">Disponible hoy</span>
            </div>
        `).join('');
    }

    function selectBranch(id, nombre) {
        reserva.sucursal = id;
        document.querySelectorAll('.branch-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`branch-${id}`).classList.add('selected');
        
        document.getElementById('active-branch-name').innerText = nombre;
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('step-3').classList.remove('hidden');

        renderFilteredData(id);
        window.scrollTo({ top: document.getElementById('step-2').offsetTop - 100, behavior: 'smooth' });
    }

    function renderFilteredData(sucursalId) {
        // Filtrar Barberos
        const barbersCont = document.getElementById('barbers-container');
        const filteredBarbers = DATA.barberos.filter(b => b.sucursal === sucursalId);
        barbersCont.innerHTML = filteredBarbers.map(b => `
            <div class="item-card" onclick="selectItem('barbero', '${b.id}', '${b.nombre}')" id="barbero-${b.id}">
                <h4>${b.nombre}</h4>
                <p>Barbero Senior</p>
            </div>
        `).join('');

        // Filtrar Servicios
        const servicesCont = document.getElementById('services-container');
        const filteredServices = DATA.servicios.filter(s => s.sucursal.includes(sucursalId));
        servicesCont.innerHTML = filteredServices.map(s => `
            <div class="item-card" onclick="selectItem('servicio', '${s.id}', '${s.nombre}', ${s.precio})" id="servicio-${s.id}">
                <h4>${s.nombre}</h4>
                <p style="color: var(--accent); font-weight: bold;">$${s.precio}</p>
            </div>
        `).join('');

        renderHours();
    }

    function selectItem(tipo, id, nombre, precio = 0) {
        reserva[tipo] = { id, nombre, precio };
        document.querySelectorAll(`#${tipo}s-container .item-card`).forEach(c => c.classList.remove('selected'));
        if(document.getElementById(`${tipo}-${id}`)) {
            document.getElementById(`${tipo}-${id}`).classList.add('selected');
        }
        updateSummary();
    }

    function renderHours() {
        const hoursCont = document.getElementById('hours-container');
        const horas = ["10:00", "11:00", "12:00", "13:00", "16:00", "17:00", "18:00"];
        hoursCont.innerHTML = horas.map(h => `
            <div class="item-card" style="padding: 10px; text-align: center;" onclick="selectItem('hora', '${h}', '${h}')" id="hora-${h}">
                ${h}
            </div>
        `).join('');
    }

    function updateSummary() {
        const sum = document.getElementById('summary-text');
        if (reserva.sucursal && reserva.servicio && reserva.barbero && reserva.hora) {
            sum.innerHTML = `
                📍 <b>${DATA.sucursales.find(s => s.id === reserva.sucursal).nombre}</b><br>
                ✂️ ${reserva.servicio.nombre} ($${reserva.servicio.precio})<br>
                👤 Barbero: ${reserva.barbero.nombre}<br>
                ⏰ Horario: ${reserva.hora.nombre} hs
            `;
            document.getElementById('btn-confirm').disabled = false;
        }
    }

    // --- LOGICA DE ENVÍO Y NOTIFICACIÓN (PASO 2) ---

    async function confirmarReserva() {
        const nombreCliente = prompt("Por favor, ingresá tu nombre para confirmar:");
        if(!nombreCliente) return;

        const barberoInfo = DATA.barberos.find(b => b.id === reserva.barbero.id);
        const sucursalNombre = DATA.sucursales.find(s => s.id === reserva.sucursal).nombre;

        // 1. Guardar en Google Sheets (Background)
        const datosTurno = {
            sucursal: sucursalNombre,
            servicio: reserva.servicio.nombre,
            barbero: barberoInfo.nombre,
            precio: reserva.servicio.precio,
            cliente: nombreCliente,
            hora: reserva.hora.nombre
        };

        try {
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosTurno)
            });
        } catch (e) {
            console.log("Error enviando a la Sheet, pero procedemos con el WhatsApp");
        }

        // 2. Notificar al Barbero Específico por WhatsApp
        const msgBarbero = `*¡HOLA ${barberoInfo.nombre.toUpperCase()}, NUEVO TURNO!*%0A` +
                           `------------------------------%0A` +
                           `📍 Sucursal: ${sucursalNombre}%0A` +
                           `👤 Cliente: ${nombreCliente}%0A` +
                           `✂️ Servicio: ${reserva.servicio.nombre}%0A` +
                           `⏰ Hora: ${reserva.hora.nombre}%0A` +
                           `------------------------------%0A` +
                           `_Turno enviado automáticamente por Fontana Designs_`;
        
        // Abrir WhatsApp del barbero seleccionado
        window.open(`https://wa.me/${barberoInfo.telefono}?text=${msgBarbero}`, '_blank');

        alert("¡Turno confirmado! Se le ha enviado un aviso al barbero.");
        location.reload();
    }

    // Inicializar la App
    renderBranches();
    </script>
</body>
</html>
